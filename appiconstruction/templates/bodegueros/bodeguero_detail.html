{% extends 'base.html' %}

{% block title %}{{ bodeguero }} - Detalle{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="{% url 'bodeguero_list' %}">Bodegueros</a>
                </li>
                <li class="breadcrumb-item active">{{ bodeguero }}</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-person-badge"></i> Información del Bodeguero
                </h5>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-4">ID:</dt>
                    <dd class="col-sm-8">
                        <span class="badge bg-secondary">{{ bodeguero.id_bodeguero }}</span>
                    </dd>
                </dl>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0"><i class="bi bi-gear"></i> Acciones</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <a href="{% url 'bodeguero_update' bodeguero.id_bodeguero %}" class="btn btn-warning">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                    <a href="{% url 'bodeguero_delete' bodeguero.id_bodeguero %}" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Eliminar
                    </a>
                    <hr>
                    <a href="{% url 'bodeguero_list' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
