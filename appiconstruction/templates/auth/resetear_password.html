{% extends 'base.html' %}

{% block title %}Resetear Contraseña{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">
                    <i class="bi bi-key"></i> Resetear Contraseña
                </h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <strong>Usuario:</strong> {{ usuario.get_full_name }} ({{ usuario.username }})
                </div>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">
                            Nueva Contraseña <span class="text-danger">*</span>
                        </label>
                        <input type="password" name="nueva_password" class="form-control" 
                               placeholder="Nueva contraseña" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Confirmar Contraseña <span class="text-danger">*</span>
                        </label>
                        <input type="password" name="confirmar_password" class="form-control" 
                               placeholder="Confirmar contraseña" required>
                    </div>

                    <div class="alert alert-warning">
                        <strong>Nota:</strong> La contraseña debe tener al menos 8 caracteres.
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'gestion_usuarios' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-info">
                            <i class="bi bi-check-circle"></i> Resetear Contraseña
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
